name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# OIDC-based GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; never cancel one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # npm ci, not npm install: the committed lock pins the mermaid/vitepress versions the
      # es2022 + optimizeDeps settings in docs/.vitepress/config.mts were verified against.
      # The rendered drawings and photos are committed under docs/public/: nothing to generate.
      - name: Build documentation
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
